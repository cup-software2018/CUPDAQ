# AMoRE plastic scintillator muon detector (PSMD): IADCT waveform mode + PSMDTrigger

# Trigger Control Board Configuration
TCB:
  TYPE: 0
  CW: 64
  PTRG: 10
  MTHRF: 38
  PSCF: 1
  TRGON: 3

IADCT:
  - SID: 1
    NCH: 40
    ENABLED: 1
    MODE: 1
    RL: 8

    # --- Channel Mapping ---
    # PID: zeros indicate disconnected channels as per your original text
    CID: [1]
    PID: [1]

    # --- Timing & Thresholds ---
    CW: 256
    GW: 2000
    DLY: 2000
    PSW: 256
    THR: 100

    # --- Trigger Lookup Table (Sequence) ---
    TLT: [
      "1x2x3x4", 
      "1x2x4", 
      "1x2x3", 
      "1x2x3", 
      "1x2x3", 
      "1x2x3", 
      "1x2+3x4", 
      "1x2+3x4",
      "1x2+3x4",
      "1x2+3x4"
    ]

    HV: [50, 50, 50, 50, 50]

  - SID: 2
    NCH: 40
    ENABLED: 1
    MODE: 1
    RL: 8

    # --- Channel Mapping ---
    # PID: zeros indicate disconnected channels as per your original text
    CID: [1]
    PID: [41]

    # --- Timing & Thresholds ---
    CW: 256
    GW: 2000
    DLY: 2000
    PSW: 256
    THR: 100

    # --- Trigger Lookup Table (Sequence) ---
    TLT: [
      "1x2x3x4", 
      "1x2x4", 
      "1x2x3", 
      "1x2x3", 
      "1x2x3", 
      "1x2x3", 
      "1x2+3x4", 
      "1x2+3x4",
      "1x2+3x4",
      "1x2+3x4"
    ]

    HV: [50, 50, 50, 50, 50]    


# PSMD software trigger (applied in the merger)
#   Trigger bits are set per 4-channel group, so a tbit=1 channel may itself be below threshold.
#   With PeakSum on, each tbit=1 channel is triggered again: the largest sliding sum of
#   (ADC - pedestal) over PSW/16 samples (16 ns/sample) must exceed ThrScale x THR of its IADCT.
#   A channel fires if it has tbit=1 (and passes the peak sum when PeakSum is on).
#   Rejects events that have no channel that fired.
#   Random-trigger events (trigger type 1) always pass with all channels.
PSMDTrigger:
  Enabled: 1   # 1: on, 0 or omitted: off
  ZSUTBit: 1   # 1: zero-suppress channels that did not fire, 0 or omitted: keep all channels
  PeakSum: 1   # 1: re-trigger tbit=1 channels with the peak sum, 0 or omitted: tbit only
  ThrScale: 2  # peak sum threshold = ThrScale x THR; the hardware fires at 2 x THR of the
               # 16-sample sum of recorded samples (runs 324, 327); omitted: 1
